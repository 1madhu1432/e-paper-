<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1d3a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Circular Navy Brand Icon -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="12" />
  
  <!-- Outer Gold Accent Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.8" />

  <!-- Newspaper Fold Graphic Icon -->
  <g transform="translate(136, 120)">
    <rect x="0" y="0" width="240" height="260" rx="16" fill="#ffffff" />
    <path d="M180 0 L240 60 L240 260 L0 260 L0 0 Z" fill="#ffffff" />
    <path d="M180 0 L180 60 L240 60 Z" fill="#cbd5e1" />
    
    <!-- Red Header Block -->
    <rect x="24" y="32" width="140" height="24" rx="4" fill="#dc2626" />
    
    <!-- Article Text Lines -->
    <rect x="24" y="80" width="192" height="14" rx="4" fill="#0b1d3a" />
    <rect x="24" y="110" width="192" height="14" rx="4" fill="#0b1d3a" />
    
    <rect x="24" y="145" width="90" height="85" rx="6" fill="#1e40af" />
    <rect x="126" y="145" width="90" height="10" rx="3" fill="#64748b" />
    <rect x="126" y="165" width="90" height="10" rx="3" fill="#64748b" />
    <rect x="126" y="185" width="90" height="10" rx="3" fill="#64748b" />
    <rect x="126" y="205" width="70" height="10" rx="3" fill="#64748b" />
  </g>

  <!-- Telugu Logo Overlay Badge "PM" -->
  <circle cx="360" cy="360" r="70" fill="#dc2626" stroke="#ffffff" stroke-width="8" />
  <text x="360" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">PM</text>
</svg>